name: Publiceer op GitHub Pages

on:
  push:
    branches: [main, claude/activity-suggestion-app-757w5h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Zet de site klaar
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.json sw.js js icons _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicatie
        uses: actions/deploy-pages@v4
